name: Restaurant Service CI

on:
  push:
    branches:
      - main

jobs:
  build_job:
    runs-on: [self-hosted, quickbite, restaurant] # Khớp chính xác các nhãn (labels) đã định nghĩa trong docker-compose.yml của runner
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          chmod +x ./gradlew
          ./gradlew bootJar
